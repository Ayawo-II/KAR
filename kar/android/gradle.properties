org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.ndkVersion=27.0.12077973

# The Kotlin incremental compiler writes memory-mapped .tab cache files that
# intermittently fail to close on this machine ("Could not close incremental
# caches", "Daemon compilation failed"). Compiling in-process without
# incremental caches removes that failure mode at the cost of a slower build.
# Remove these two lines once the toolchain is used from a local NTFS volume.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
